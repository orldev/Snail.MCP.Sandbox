name: build and tests

# The shared server CI of Snail.Sdk: the tests, the conformance check and the tool reference, then the server as it is
# published — framework-dependent, as the image runs it — started and asked over HTTP, the only transport it has. Neither
# needs Docker: the live tests skip unless SNAIL_SANDBOX_LIVE_RUNTIME names a runtime, and the started server is pointed
# at a socket that does not exist. The images are images.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/mcp-ci.yml@v1
    with:
      contract-variable: SNAIL_SANDBOX_SERVER
      contract-filter: FullyQualifiedName~ProcessContract
