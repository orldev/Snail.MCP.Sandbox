name: container images

# The two images, through the shared image workflow of Snail.Sdk: built on every push and pull request, and pushed to
# the registry only from a v* tag, with the version, latest and the commit. Both carry the server's version: the
# executor is part of the same contract, since the tool description names the libraries it installs.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ghcr.io/<owner>/s3l-sandbox-mcp, the server.
  server:
    permissions: { contents: read, packages: write }
    uses: orldev/Snail.Sdk/.github/workflows/mcp-image.yml@v1
    with:
      dockerfile: deploy/server/Dockerfile

  # ghcr.io/<owner>/sandbox-python, the image a run executes in.
  executor:
    permissions: { contents: read, packages: write }
    uses: orldev/Snail.Sdk/.github/workflows/mcp-image.yml@v1
    with:
      dockerfile: deploy/executor/Dockerfile
      image: sandbox-python
