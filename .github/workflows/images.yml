name: Container images

# A tag builds both images and pushes them to the GitHub Container Registry, private with the repository.
# Both carry the server's version: the executor is part of the same contract, since the tool description
# names the libraries it installs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sandbox-python
            dockerfile: deploy/executor/Dockerfile
          - image: s3l-sandbox-mcp
            dockerfile: deploy/server/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "tag=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Snail.MCP.Sandbox.csproj)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
